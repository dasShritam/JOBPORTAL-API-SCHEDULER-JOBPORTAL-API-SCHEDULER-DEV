replicaCount: 1
image:
  repository: $(SCHEDULER_IMG_REGISTRY)
  pullPolicy: IfNotPresent
  tag: $(Build.BuildId)
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  name: scheduler-svc
  type: ClusterIP
  port: $(SCHEDULER_SVC_PORT)
  targetPort: $(SCHEDULER_SVC_PORT)
  protocol: TCP

resources:
  requests:
    cpu: 250m
    memory: 500Mi
  limits:
    cpu: 500m
    memory: 1Gi
app:
  name: scheduler-depl
  group: api
  namespace: jobportal-app
  releasename: scheduler-release
  releasenamespace: jobportal-app
  managedby: Helm
nodeSelector:
  agentpool: app
secrets:
  scheduler:
    name: jobportal-scheduler-secret
    SCHEDULER_SVC_PORT: $(SCHEDULER_SVC_PORT)
    ENVIRONMENT: $(ENVIRONMENT)
    STORAGE_ACC_URI: $(STORAGE_ACC_URI)
    PAGE_LIMIT: $(PAGE_LIMIT)
    ACCOUNT_ACT_REMIND_DAY: $(ACCOUNT_ACT_REMIND_DAY)
    MAX_RETRY_LIMIT: $(MAX_RETRY_LIMIT)
    APP_CONNECTIONSTRING_MONGO: $(APP_CONNECTIONSTRING_MONGO)
    BLOB_AC_NAME: $(BLOB_AC_NAME)
    BLOB_AC_KEY: $(BLOB_AC_KEY)
    BLOB_CONNECTION_STRING: $(BLOB_CONNECTION_STRING)
    BLOB_LOGGER_CONTAINER: $(BLOB_LOGGER_CONTAINER)
    BLOB_EMPLOYER_CONTAINER: $(BLOB_EMPLOYER_CONTAINER)
    LOG_LEVEL: $(LOG_LEVEL)
    MAIL_SVC_HOST: $(MAIL_SVC_HOST)
    MAIL_SVC_PORT: $(MAIL_SVC_PORT)
    MAIL_SVC_USERNAME: $(MAIL_SVC_USERNAME)
    MAIL_SVC_PASSWORD: $(MAIL_SVC_PASSWORD)
    MAIL_SVC_FROM_NAME: $(MAIL_SVC_FROM_NAME)
    MAIL_SVC_FROM: $(MAIL_SVC_FROM)
    UI_URL: $(UI_URL)