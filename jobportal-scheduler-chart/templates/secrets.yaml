apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: {{ .Values.secrets.scheduler.name }}
      namespace: {{ .Values.app.namespace }}
    type: Opaque
    data:
      SCHEDULER_SVC_PORT: {{ .Values.secrets.scheduler.SCHEDULER_SVC_PORT }}
      ENVIRONMENT: {{ .Values.secrets.scheduler.ENVIRONMENT }}
      STORAGE_ACC_URI: {{ .Values.secrets.scheduler.STORAGE_ACC_URI }}
      PAGE_LIMIT: {{ .Values.secrets.scheduler.PAGE_LIMIT }}
      ACCOUNT_ACT_REMIND_DAY: {{ .Values.secrets.scheduler.ACCOUNT_ACT_REMIND_DAY }}
      MAX_RETRY_LIMIT: {{ .Values.secrets.scheduler.MAX_RETRY_LIMIT }}
      APP_CONNECTIONSTRING_MONGO: {{ .Values.secrets.scheduler.APP_CONNECTIONSTRING_MONGO }}
      BLOB_AC_NAME: {{ .Values.secrets.scheduler.BLOB_AC_NAME }}
      BLOB_AC_KEY: {{ .Values.secrets.scheduler.BLOB_AC_KEY }}
      BLOB_CONNECTION_STRING: {{ .Values.secrets.scheduler.BLOB_CONNECTION_STRING }}
      BLOB_LOGGER_CONTAINER: {{ .Values.secrets.scheduler.BLOB_LOGGER_CONTAINER }}
      BLOB_EMPLOYER_CONTAINER: {{ .Values.secrets.scheduler.BLOB_EMPLOYER_CONTAINER }}
      LOG_LEVEL: {{ .Values.secrets.scheduler.LOG_LEVEL }}
      MAIL_SVC_HOST: {{ .Values.secrets.scheduler.MAIL_SVC_HOST }}
      MAIL_SVC_PORT: {{ .Values.secrets.scheduler.MAIL_SVC_PORT }}
      MAIL_SVC_USERNAME: {{ .Values.secrets.scheduler.MAIL_SVC_USERNAME }}
      MAIL_SVC_PASSWORD: {{ .Values.secrets.scheduler.MAIL_SVC_PASSWORD }}
      MAIL_SVC_FROM_NAME: {{ .Values.secrets.scheduler.MAIL_SVC_FROM_NAME }}
      MAIL_SVC_FROM: {{ .Values.secrets.scheduler.MAIL_SVC_FROM }}
      UI_URL: {{ .Values.secrets.scheduler.UI_URL }}
      
